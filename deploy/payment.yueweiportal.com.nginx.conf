server {
    listen 80;
    listen [::]:80;
    server_name payment.yueweiportal.com;

    root /www/wwwroot/payment.yueweiportal.com;
    access_log /www/wwwlogs/payment.yueweiportal.com.log;
    error_log /www/wwwlogs/payment.yueweiportal.com.error.log;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name payment.yueweiportal.com;

    ssl_certificate /etc/letsencrypt/live/payment.yueweiportal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/payment.yueweiportal.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/payment.yueweiportal.com.log;
    error_log /www/wwwlogs/payment.yueweiportal.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
